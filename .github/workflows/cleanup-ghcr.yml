name: Cleanup GHCR

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  purge:
    name: Delete all package versions except latest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete specified package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: go-github-mcp
          package-type: container
          package-version-ids: "1586178212,1586196588"
